  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(encrypted.iv)},key,decode(encrypted.ciphertext));
  const html=new TextDecoder().decode(plain);field.value='';document.open();document.write(html);document.close();
 }catch{
  error.hidden=false;error.textContent='Пароль не подошёл. Попробуй ещё раз.';field.setAttribute('aria-invalid','true');field.focus();
 }finally{busy=false;button.disabled=false;button.textContent='Открыть игру';}
